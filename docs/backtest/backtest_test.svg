<line class="g" x1="416.7" x2="416.7" y1="60" y2="204"/><text class="s" x="416.7" y="220" text-anchor="middle">48 h</text>
<line class="g" x1="550.0" x2="550.0" y1="60" y2="204"/><text class="s" x="550.0" y="220" text-anchor="middle">72 h</text>
<text class="l" x="140" y="85.0" text-anchor="end">syn-h1 · fall</text>
