<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" width="640" height="234" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, system-ui, sans-serif">
<title id="t">Lead time before the synthetic outcome (held-out patients)</title>
<desc id="d">Detection: 3 of 4 storylines flagged before the outcome (75%); 2 of 4 reached elevated (50%). Lead time: median 34.4 h (1.4 days), range 21.9-57.0 h (0.9-2.4 days), n = 3. False flags on stable controls: 0.27 elevated and 0.27 of any level per patient-week (1 elevated, 1 total over 3.7 patient-weeks). Budget 0.5 / 1.0: within. Synthetic data.</desc>
<style>:root{--surface:#fbfaf7;--ink:#1d1c1a;--ink2:#57544e;--ink3:#7a766d;--grid:#e4e0d7;--bar:#24487a}@media (prefers-color-scheme: dark){:root{--surface:#1c1b18;--ink:#ebe8e1;--ink2:#aaa59b;--ink3:#8a867d;--grid:#34322d;--bar:#8fb1e3}}.bg{fill:var(--surface)}.t{fill:var(--ink);font-size:14px;font-weight:600}.s{fill:var(--ink3);font-size:11px}.l{fill:var(--ink);font-size:12px}.v{fill:var(--ink2);font-size:12px}.g{stroke:var(--grid);stroke-width:1}.bar{fill:var(--bar)}.dot{fill:var(--ink);stroke:var(--surface);stroke-width:2}</style>
<rect class="bg" width="640" height="234"/>
<text class="t" x="16" y="22">Lead time before the synthetic outcome (held-out patients)</text>
<text class="s" x="16" y="40">Synthetic data. Bar: first flag on the patient's own risk. Dot: first elevated flag.</text>
